server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Liveness probe for Docker / Traefik.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Vite emits content-hashed assets -> cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached so new deployments are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA history fallback for /, /seller/*, /admin/* client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
